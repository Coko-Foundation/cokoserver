on:
  workflow_call:

jobs:
  test:
    name: Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    env:
      NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server
        id: build_server
        run: docker compose build

      - name: Pull containers
        id: pull_containers
        run: docker compose pull --ignore-buildable

      - name: Test server
        id: test_server
        run: |
          docker compose run server \
          yarn workspace @coko/server test --coverage --reporter=tree
